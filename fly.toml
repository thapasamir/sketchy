# fly.toml app configuration file generated for sketchy-tidy-cherry-4823 on 2026-10-04T00:54:04+05:45
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sketchy-tidy-cherry-4823'
primary_region = 'fra'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'sketchy-tidy-cherry-4823.fly.dev'
  POOL_SIZE = '5'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
