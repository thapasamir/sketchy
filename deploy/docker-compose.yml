# Runs on the droplet in /opt/sketchy. Postgres is NOT here: the app talks to Neon.
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      # the header Caddy sets to the visitor's address (see Caddyfile)
      CLIENT_IP_HEADER: x-real-ip
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
